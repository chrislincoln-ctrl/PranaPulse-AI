<!doctype html>
<html lang="en" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PranaPulse AI: Winter Smog, Indoor Clearance, and Low-Emission Family Assistant with live telemetry, CPCB NAQI, and inhaled dose optimization."
    />
    <script>
      try {
        const savedMode = localStorage.getItem('pranapulse_theme_mode');
        if (savedMode === 'light' || savedMode === 'dark') {
          document.documentElement.dataset.mode = savedMode;
        } else {
          document.documentElement.dataset.mode = 'dark';
        }
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <title>PranaPulse AI: Urban Air Quality & Winter Smog Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
